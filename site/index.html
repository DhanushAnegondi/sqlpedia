<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQLpedia</title>
<meta name="description" content="SQL interview practice: problems with their own tables, an in-browser MySQL / SQL Server editor, and a handbook of runnable examples.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='7' rx='11' ry='4.5' fill='none' stroke='%232f5fd0' stroke-width='2.4'/%3E%3Cpath d='M5 7v18c0 2.5 4.9 4.5 11 4.5s11-2 11-4.5V7' fill='none' stroke='%232f5fd0' stroke-width='2.4'/%3E%3Cpath d='M5 16c0 2.5 4.9 4.5 11 4.5s11-2 11-4.5' fill='none' stroke='%232f5fd0' stroke-width='2.4'/%3E%3C/svg%3E">
<script>
  try {
    const t = localStorage.getItem("sqlpedia.theme");
    if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="nav"></button>
  <a class="brand" href="#/" aria-label="SQLpedia home">
    <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><ellipse cx="16" cy="7" rx="11" ry="4.5"/><path d="M5 7v18c0 2.5 4.9 4.5 11 4.5s11-2 11-4.5V7"/><path d="M5 16c0 2.5 4.9 4.5 11 4.5s11-2 11-4.5"/></svg>
    <span class="serif">SQLpedia</span>
  </a>
  <nav class="nav" id="nav" aria-label="Main">
    <a href="#/problems" data-nav="problems">Problems</a>
    <a href="#/handbook" data-nav="handbook">Handbook</a>
    <a href="#/progress" data-nav="progress">Progress</a>
    <a href="classic/" title="The original Wikipedia-style version">Classic</a>
  </nav>
  <div class="spacer"></div>
  <div class="search" role="search">
    <span id="searchIcon"></span>
    <input id="search" type="search" placeholder="Search problems and handbook" aria-label="Search problems and handbook" autocomplete="off" aria-controls="searchPop" aria-expanded="false">
    <kbd>/</kbd>
    <div class="search-pop" id="searchPop" role="listbox"></div>
  </div>
  <a class="streak" id="streak" href="#/progress" title="Practice streak"></a>
  <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode"></button>
</header>

<main id="main" tabindex="-1"><div class="page"><p class="muted">Loading…</p></div></main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
